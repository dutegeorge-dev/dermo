<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Вход в админку — ТЛК БАРС</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #1e3fd0;
        --ink: #1e2532;
        --muted: #6b7280;
        --line: #e2e8f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eef1f6;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--ink);
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      .brand {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 4px;
      }
      .sub { margin: 0 0 24px; color: var(--muted); font-size: 13px; }
      label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
      input {
        width: 100%;
        padding: 11px 12px;
        font-size: 15px;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: none;
        margin-bottom: 16px;
        background: #fff;
        color: var(--ink);
      }
      input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(30, 63, 208, 0.12); }
      button {
        width: 100%;
        padding: 12px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: var(--brand);
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      button:hover { background: #1a37b8; }
      .error {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
        font-size: 13px;
        border-radius: 10px;
        padding: 10px 12px;
        margin: 0 0 18px;
      }
    </style>
  </head>
  <body>
    <form class="card" method="POST" action="/api/cms/login">
      <p class="brand">ТЛК БАРС</p>
      <p class="sub">Вход в панель управления контентом</p>
      <div class="error" id="error" hidden>Неверный логин или пароль.</div>
      <label for="login">Логин</label>
      <input id="login" name="login" type="text" autocomplete="username" autofocus required />
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Войти</button>
    </form>
    <script>
      if (new URLSearchParams(location.search).has("error")) {
        document.getElementById("error").hidden = false;
      }
    </script>
  </body>
</html>
