<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ТЛК БАРС — Админ-панель</title>
  </head>
  <body>
    <!-- Кнопка выхода из сессии (логин/пароль из .env — своя авторизация,
         Decap про неё не знает, поэтому добавляем ссылку сами). -->
    <a
      href="/api/cms/logout"
      style="position: fixed; z-index: 9999; right: 12px; bottom: 12px; padding: 7px 12px; font: 13px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; color: #fff; background: #1e2532; border-radius: 8px; text-decoration: none; opacity: 0.85;"
      >Выйти</a
    >
    <!-- Decap CMS. Версия зафиксирована: протокол proxy-бэкенда должен
         совпадать с установленным decap-server (см. package.json). -->
    <script src="https://unpkg.com/decap-cms@3.16.1/dist/decap-cms.js"></script>
  </body>
</html>
