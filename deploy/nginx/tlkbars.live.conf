# Живой конфиг nginx для tlkbars.ru (самописный, свои SSL-сертификаты в /etc/ssl).
# К исходному добавлены CMS-локации: гейт /admin (auth_request проверяет
# сессию нашим сервером), страница входа и /api/cms с увеличенным лимитом тела
# под загрузку картинок; и внутренний раздел /crm/ (прокси на bars-crm :3100).
# Остальное — SSL, root, общий /api/ — без изменений.
#
# Установка (файл, на который смотрит симлинк sites-enabled, называется `tlkbars`):
#   cp /etc/nginx/sites-available/tlkbars /etc/nginx/sites-available/tlkbars.bak
#   cp deploy/nginx/tlkbars.live.conf /etc/nginx/sites-available/tlkbars
#   nginx -t && systemctl reload nginx
# Откат: cp /etc/nginx/sites-available/tlkbars.bak /etc/nginx/sites-available/tlkbars

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name tlkbars.ru www.tlkbars.ru;
    return 301 https://tlkbars.ru$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/tlkbars-fullchain.crt;
    ssl_certificate_key /etc/ssl/tlkbars.key;

    return 444;
}

server {
    listen 443 ssl;
    server_name tlkbars.ru www.tlkbars.ru;

    ssl_certificate     /etc/ssl/tlkbars-fullchain.crt;
    ssl_certificate_key /etc/ssl/tlkbars.key;

    root /var/www/tlkbars/repo/_site;
    index index.html;

    # Снятые с сайта торговые услуги («Аудит производства», «Проверка завода»):
    # страницы удалены, старые URL были в индексе — отдаём 301 на витрину услуг.
    location = /uslugi/torgovlya/audit-proizvodstva/ { return 301 /uslugi/torgovlya/; }
    location = /uslugi/torgovlya/proverka-zavoda/ { return 301 /uslugi/torgovlya/; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Автоматические сканеры постоянно ищут .git, .env и другие скрытые
    # файлы. Репозиторий не находится под web-root, но явно отклоняем такие
    # запросы без попытки обработать их как страницу сайта.
    location ~ /\. { return 404; }

    location ~* ^/assets/(fonts|img)/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }
    location ~* ^/assets/(css|js)/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # ── Админка CMS: логин/пароль из .env, без GitHub ───────────────────────
    # Внутренняя проверка сессии для auth_request (тело запроса не нужно).
    location = /__cms_verify {
        internal;
        proxy_pass http://127.0.0.1:3000/api/cms/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Страница входа — единственное место под /admin без гейта (иначе цикл).
    location = /admin/login.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # В стандартной таблице MIME nginx расширение .yml отсутствует.
    location = /admin/config.yml {
        auth_request /__cms_verify;
        error_page 401 = @cms_login;
        default_type text/yaml;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Протокол Decap → наш сервер. Длиннее префикса /api/, поэтому для /api/cms/*
    # берётся эта локация. Лимит тела больше — загрузка картинок идёт base64.
    location /api/cms/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
        proxy_connect_timeout 10s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
        send_timeout         300s;
        proxy_buffering on;
        add_header Cache-Control "no-store" always;
    }

    # Каталог = /admin → /admin/.
    location = /admin { return 301 /admin/; }

    # Сама админка — только при валидной сессии; иначе редирект на вход.
    location /admin/ {
        auth_request /__cms_verify;
        error_page 401 = @cms_login;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /admin/index.html;
    }
    location @cms_login { return 302 /admin/login.html; }

    # ── Внутренний раздел /crm/ (база знаний + CRM) ─────────────────────────
    # Всё под /crm/ — и SPA, и API (/crm/api/) — отдаёт сервис bars-crm
    # (crm/, слушает 127.0.0.1:3100). Вход по логину и паролю проверяет сам
    # сервис. Раздел не индексируется: X-Robots-Tag на любой ответ (сервис
    # ставит его и сам — здесь страховка) + Disallow: /crm/ в robots.txt.
    location = /crm { return 301 /crm/; }

    location ^~ /crm/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Вложения страниц базы знаний (лимит сервиса — CRM_MAX_UPLOAD_MB).
        client_max_body_size 30m;
        proxy_connect_timeout 5s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;

        proxy_hide_header X-Robots-Tag;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Общий проброс остального API (заявки /api/lead, курсы /api/rates) на обработчик.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
