# ─────────────────────────────────────────────────────────────────────────────
# nginx для сайта ООО ТЛК БАРС.
#
# Раздаёт статику из _site/ и проксирует /api/lead (заявки) и /api/rates
# (курсы ЦБ для калькулятора) на обработчик — server/index.ts, слушает
# 127.0.0.1:3000, наружу порт не выставляется.
#
# Установка:
#   sudo cp deploy/nginx/snippets/tlkbars-security.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/tlkbars.ru.conf /etc/nginx/sites-available/tlkbars.ru
#   sudo ln -s /etc/nginx/sites-available/tlkbars.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат выпускается certbot'ом:
#   sudo certbot --nginx -d tlkbars.ru -d www.tlkbars.ru
#
# ⚠️ Ограничение частоты запросов к форме требует зоны в блоке http{}
# (обычно /etc/nginx/nginx.conf) — location'у зона доступна, а объявить её
# внутри server{} нельзя:
#   limit_req_zone $binary_remote_addr zone=lead_api:10m rate=20r/m;
# Строку limit_req ниже раскомментируйте после добавления зоны.
# ─────────────────────────────────────────────────────────────────────────────

# HTTP → HTTPS. Отдельным сервером, чтобы certbot мог обновлять сертификат.
server {
    listen 80;
    listen [::]:80;
    server_name tlkbars.ru www.tlkbars.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://tlkbars.ru$request_uri;
    }
}

# www → без www (канонический хост — как в SITE_URL).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tlkbars.ru;

    ssl_certificate     /etc/letsencrypt/live/tlkbars.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tlkbars.ru/privkey.pem;

    return 301 https://tlkbars.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tlkbars.ru;

    ssl_certificate     /etc/letsencrypt/live/tlkbars.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tlkbars.ru/privkey.pem;

    # Каталог сборки 11ty (npm run build).
    root /var/www/tlkbars/repo/_site;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Заголовки безопасности. include, а не add_header: любой location со
    # своим add_header отменяет унаследованные, поэтому сниппет подключается
    # в каждый такой блок отдельно.
    include snippets/tlkbars-security.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml font/woff2;

    # ── Заявки с форм → обработчик на 3000 ──────────────────────────────────
    # Тот же домен, поэтому CORS не нужен: в сборке достаточно
    # LEAD_API_URL=/api/lead.
    location = /api/lead {
        # limit_req zone=lead_api burst=5 nodelay;   # см. комментарий выше

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Обработчик берёт IP клиента из X-Forwarded-For — без этих заголовков
        # антиспам считал бы все заявки пришедшими с самого nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Заявка — это несколько килобайт текста; обработчик и сам режет тело.
        client_max_body_size 32k;

        proxy_connect_timeout 5s;
        proxy_send_timeout   30s;
        proxy_read_timeout   30s;

        # Ответ формы кэшировать нельзя ни при каких условиях.
        proxy_buffering off;
        include snippets/tlkbars-security.conf;
        add_header Cache-Control "no-store" always;
    }

    # ── Курсы ЦБ для калькулятора доставки ──────────────────────────────────
    # Обработчик сам кэширует курс на несколько часов и ходит в ЦБ не чаще;
    # здесь только проксирование, кэш-заголовок приходит от него.
    location = /api/rates {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout   15s;

        include snippets/tlkbars-security.conf;
    }

    # Проверка живости обработчика (закрыта от внешнего мира).
    location = /api/healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000/healthz;
    }

    # ── Статика ─────────────────────────────────────────────────────────────
    # Шрифты и картинки: имена стабильны, содержимое — нет, но меняется редко.
    location ~* ^/assets/(fonts|img)/ {
        include snippets/tlkbars-security.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # CSS и JS собираются под постоянными именами (styles.css, main.js),
    # поэтому долгий кэш здесь означал бы «клиент не увидит новую вёрстку».
    location ~* ^/assets/(css|js)/ {
        include snippets/tlkbars-security.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # HTML: всегда проверять актуальность у сервера.
    location / {
        include snippets/tlkbars-security.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        # 11ty генерирует «красивые» URL каталогами: /kontakty/ → /kontakty/index.html
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
