# Заголовки безопасности, общие для всех ответов сайта.
#
# Вынесены в отдельный файл не для красоты: в nginx `add_header` внутри
# location ПОЛНОСТЬЮ отменяет заголовки, объявленные уровнем выше. Любой
# location, который задаёт свой Cache-Control, обязан подключить этот файл,
# иначе тихо потеряет заголовки сервера.
#
# Установка: sudo cp deploy/nginx/snippets/tlkbars-security.conf /etc/nginx/snippets/

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
