<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 360px; margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; color: #0f172a; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      label { display: block; font-size: 11px; color: #475569; margin: 8px 0 2px; }
      input { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
      .row { display: flex; gap: 8px; margin-top: 10px; }
      button { flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; font: inherit; cursor: pointer; }
      button.primary { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
      #status { margin-top: 10px; font-weight: 600; }
      #log { margin-top: 6px; max-height: 220px; overflow: auto; font-size: 11px; color: #475569; white-space: pre-wrap; }
      .hint { font-size: 11px; color: #64748b; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>Ирбис · сборщик WB</h1>
    <label for="url">Адрес Ирбиса</label>
    <input id="url" placeholder="https://datapoint-sync.ru/crm" />
    <label for="token">Ключ сборщика (Ирбис → Лидогенерация → Сбор)</label>
    <input id="token" type="password" placeholder="irbis_…" />
    <div class="row">
      <button id="start" class="primary">Запустить</button>
      <button id="stop">Остановить</button>
    </div>
    <div id="status"></div>
    <div id="log"></div>
    <div class="hint">Вкладка WB открывается рядом и меняет страницы сама. Её можно не трогать; закрывать браузер — нельзя.</div>
    <script src="popup.js"></script>
  </body>
</html>
